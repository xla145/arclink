name: ArcLink macOS release

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/arclink-release.yml"
      - "agent-bridge/desktop/**"
      - "agent-bridge/crates/**"
      - "agent-bridge/third_party/**"
      - "agent-bridge/Cargo.*"
      - "agent-bridge/scripts/release-assets.py"
      - "agent-bridge/scripts/test-release-assets.py"
    tags:
      - "arclink-v*"

permissions:
  contents: read

concurrency:
  group: arclink-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: agent-bridge/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate signing configuration
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY secret"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret"; exit 1; }
      - name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re, tomllib
          from pathlib import Path
          version = json.loads(Path('src-tauri/tauri.conf.json').read_text())['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version), 'Use a stable semantic version'
          assert json.loads(Path('package.json').read_text())['version'] == version, 'package.json version mismatch'
          assert tomllib.loads(Path('../Cargo.toml').read_text())['workspace']['package']['version'] == version, 'Cargo workspace version mismatch'
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == f'arclink-v{version}', 'Tag must match application version'
          PY
      - name: Test release manifest assembly
        run: python3 ../scripts/test-release-assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pinned pnpm
        run: corepack enable
      - name: Install frontend dependencies
        run: corepack pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-bridge -> target
          key: ${{ matrix.target }}
      - name: Test frontend
        run: corepack pnpm test --run
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: agent-bridge/desktop
          args: --target ${{ matrix.target }} --bundles app,dmg -- --locked
        env:
          CI: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify macOS application signature
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # Check the complete bundle, not only the linker's Mach-O signature.
          # Tauri signs before creating the DMG and updater archive; do not
          # re-sign here, which would leave those packaged copies unchanged.
          codesign --verify --deep --strict --verbose=2 "../target/$TARGET/release/bundle/macos/ArcLink.app"
      - name: Prepare installers and signed updater archives
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          python3 ../scripts/release-assets.py prepare --bundle "../target/$TARGET/release/bundle" --output release-assets --arch "$ARCH" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: arclink-macos-${{ matrix.arch }}
          path: agent-bridge/desktop/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete release
    if: startsWith(github.ref, 'refs/tags/arclink-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: arclink-macos-*
          path: release-assets
          merge-multiple: true
      - name: Publish installers and checksums
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 ../agent-bridge/scripts/release-assets.py assemble --directory . --version "${TAG#arclink-v}" --repository "$GH_REPO"
          # Never let an older release move the stable update/download pointer backwards.
          gh api --paginate "repos/$GH_REPO/releases?per_page=100" --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' > release-tags.txt
          python3 - <<'PY'
          import os, re
          current = tuple(map(int, os.environ["TAG"].removeprefix("arclink-v").split(".")))
          for tag in open("release-tags.txt").read().splitlines():
              match = re.fullmatch(r"arclink-v(\d+)\.(\d+)\.(\d+)", tag)
              if match and tuple(map(int, match.groups())) >= current:
                  raise SystemExit("Refusing to overwrite or publish behind an existing stable release")
          PY
          if gh release view "$TAG" --json isDraft > release-state.json; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to overwrite a published release"'
          else
            gh release create "$TAG" --verify-tag --draft --title "ArcLink ${TAG#arclink-v}" --generate-notes
          fi
          gh release upload "$TAG" ./*.dmg ./*.app.tar.gz ./*.sig latest.json SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
