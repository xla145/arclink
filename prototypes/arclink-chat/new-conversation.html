/* ── Interaction enhancements ── */

@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes scaleIn {
  from { opacity: 0; transform: scale(.92); }
  to   { opacity: 1; transform: scale(1); }
}

/* Touch / pointer feedback */
button, .project-chip, .preferences summary {
  transition: transform .15s ease, background .2s ease, opacity .2s ease;
}
#cancel:active, .add:active { transform: scale(.9); }
.start:active:not(:disabled) { transform: scale(.94); }
.theme:active { transform: scale(.96); }
.project-chip:active { transform: scale(.97); }

/* Message area focus glow */
.message-area { transition: border-color .2s ease, box-shadow .2s ease; }
.message-area:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
}

/* Start button state transition */
.start {
  transition: transform .15s ease, background .3s ease, color .3s ease, opacity .3s ease;
}
.start:disabled {
  background: var(--soft); color: var(--muted); opacity: 1;
}

/* Feedback notice entrance */
.notice { animation: fadeSlideUp .3s ease both; }

/* Image preview entrance */
.preview { animation: scaleIn .25s cubic-bezier(.32,.72,0,1) both; }

/* Page transition overlay */
.page-transition {
  position: fixed; inset: 0; z-index: 99;
  background: var(--bg);
  opacity: 0;
  transition: opacity .35s ease;
  pointer-events: none;
}
.page-transition.active {
  opacity: 1;
  pointer-events: auto;
}

/* Preferences accordion smooth */
.settings-content {
  animation: fadeSlideUp .25s ease both;
}

/* Scene switch animation for body content */
.body > * {
  transition: opacity .2s ease;
}

</style><div class="workspace"><aside class="intro"><div class="brand">↗ ArcLink 弧连</div><h1>选好项目，<br>直接开聊。</h1><p>输入就是第一步。<br>设置按需展开，发送即开始。</p><label for="entry">切换入口来源</label><div class="controls"><select id="entry"><option value="home">首页 · 开启对话</option><option value="project">项目右上角 · 新建对话</option><option value="history">只读历史 · 新建 CLI 对话</option><option value="empty">无历史项目 · 开始</option></select><button class="theme" id="theme">◐ 切换深色外观</button></div><p id="origin">首页入口：预选当前项目，可切换。</p><p>设计预览 · 示例数据<br>所有新建入口统一样式与流程。<br>已有会话的“继续”仍进入原会话。</p><p><a href="index.html">查看对话详情原型 ↗</a></p></aside><main class="phone" id="phone"><div class="status"><span>9:41</span><span>▴ ▰ ▰</span></div><header class="header"><button id="cancel">取消</button><h2>新建对话</h2><span class="spacer"></span></header><section class="body"><label class="project-chip" for="project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5h7l2 2h9v13H3Z"/></svg><select id="project" aria-label="选择项目"><option>mac-dev</option><option>arclink-web</option><option>example-app</option></select></label><span id="path" hidden>~/Projects/mac-dev</span><div id="history" class="history-note" hidden>新建独立对话，原历史保持不变。</div><div class="message-area"><label class="sr-only" for="message">描述任务</label><textarea id="message" placeholder="想让 Codex 做什么？"></textarea><div class="attachment-list" id="attachment"></div><div class="message-bottom"><button id="add" class="add" aria-label="添加参考图片"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>参考图片</span></button><span class="image-count" id="imageCount" hidden>最多 4 张</span><button class="start" id="start" aria-label="发送并创建对话" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div><input type="file" accept="image/*" id="file" multiple hidden></div><details class="preferences"><summary><span class="sr-only">对话设置</span><span id="settingsSummary">默认设置</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg></summary><div class="settings-content"><div class="row"><label for="model">模型</label><select id="model"><option>跟随 Mac 设置</option></select></div><div class="row"><label for="policy">执行权限</label><select id="policy"><option value="workspace">项目内读写</option><option value="readonly">只读</option><option value="full">全访问</option></select></div><p class="help" id="policyHelp">项目内可读写，额外权限会请求审批。</p></div></details><p id="permissionNotice" class="permission-notice" hidden>全访问：可访问项目外文件并执行命令，无需逐项审批。</p><div class="notice" id="feedback" role="status" hidden></div></section><footer class="footer"><div class="home"></div></footer></main></div>

<!-- Page transition overlay -->
<div class="page-transition" id="pageTransition"></div>

<script>
const $=s=>document.querySelector(s);let files=[];
function sync(){$('#start').disabled=!$('#message').value.trim()&&!files.length}
function feedback(t){const el=$('#feedback');el.hidden=false;el.textContent=t;el.scrollIntoView({block:'nearest',behavior:'smooth'})}
function renderFiles(){
  const list=$('#attachment');list.replaceChildren();
  files.forEach((f,i)=>{
    const box=document.createElement('div');box.className='preview';
    const img=document.createElement('img');img.src=f.url;img.alt=f.file.name;
    const remove=document.createElement('button');remove.textContent='×';
    remove.setAttribute('aria-label','移除图片 '+f.file.name);
    remove.onclick=()=>{URL.revokeObjectURL(f.url);files.splice(i,1);renderFiles()};
    box.append(img,remove);list.append(box)});
  $('#imageCount').textContent=files.length?files.length+' / 4 张':'最多 4 张';
  $('#add').disabled=files.length>=4;sync();
}

$('#theme').onclick=()=>{let d=$('#phone').classList.toggle('dark');$('#theme').textContent=d?'◐ 切换浅色外观':'◐ 切换深色外观'};

$('#entry').onchange=()=>{
  $('#history').hidden=$('#entry').value!=='history';
  $('#origin').textContent={
    home:'首页入口：预选当前项目，可切换。',
    project:'项目右上角：预选所在项目，使用相同表单。',
    history:'只读历史：预选原项目，创建独立会话。',
    empty:'无历史项目：预选该项目，填写首条消息。'
  }[$('#entry').value];
  $('#feedback').hidden=true;
};

$('#project').onchange=()=>$('#path').textContent='~/Projects/'+$('#project').value;

$('#policy').onchange=()=>{
  const value=$('#policy').value;
  $('#policyHelp').textContent={workspace:'项目内可读写，额外权限会请求审批。',readonly:'只读取文件，不修改项目。',full:'可访问项目外文件并执行命令，无需逐项审批。'}[value];
  $('#settingsSummary').textContent=value==='workspace'?'默认设置':$('#policy').selectedOptions[0].text;
  $('#permissionNotice').hidden=value!=='full';
};

$('#message').oninput=sync;
$('#add').onclick=()=>$('#file').click();
$('#file').onchange=()=>{
  for(const f of [...$('#file').files].slice(0,4-files.length)){
    if(!f.type.startsWith('image/'))continue;
    files.push({file:f,url:URL.createObjectURL(f)});
  }
  $('#file').value='';renderFiles();
};

$('#cancel').onclick=()=>feedback('演示：返回原入口，不创建空对话。');

$('#start').onclick=()=>{
  if($('#start').disabled)return;
  const draft=$('#message').value;
  sessionStorage.setItem('arclink-prototype-draft',draft);
  feedback('已发送（演示）。正在进入对话…');
  $('#start').disabled=true;

  // Animated page transition
  const overlay=$('#pageTransition');
  setTimeout(()=>{
    overlay.classList.add('active');
    setTimeout(()=>{location.href='index.html?from=new'},380);
  },300);
};
</script></html>
