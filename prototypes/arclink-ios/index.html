<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ArcLink iOS 交互原型</title>
<style>
/* Tokens: ArcLink iOS design system (tokens.json) */
:root, [data-theme="light"] {
  --brand-navy:#171c38; --brand-teal:#50e3d4; --brand-blue:#568bff;
  --bg:#f5f6fa; --surface:#ffffff; --surface-sunken:#eceef5; --line:#e1e4ee;
  --ink:#171c38; --ink-muted:#585e76; --ink-faint:#8b91a7;
  --primary:#2f62e0; --on-primary:#ffffff; --primary-soft:#e7edfd;
  --live:#0b7f7b; --success:#1d7f4e; --success-soft:#e4f3ea; --warning:#a8540f; --warning-soft:#fcf0e1;
  --danger:#c2362b; --danger-soft:#fbe9e7;
  --agent-claude:#9a3fc9; --agent-codex:#1f8a43; --agent-herdr:#0b78b0;
  --code-bg:#141932; --code-ink:#e3e7f5; --code-muted:#8e95b3;
  --scrim:rgba(15,19,38,.45); --shadow-float:0 6px 20px rgba(23,28,56,.12);
  --chrome:#dfe2ea;
}
[data-theme="dark"] {
  --bg:#0f1326; --surface:#181d33; --surface-sunken:#232944; --line:#2b3046;
  --ink:#f3f5fc; --ink-muted:#a3aabd; --ink-faint:#6f7692;
  --primary:#6b9aff; --on-primary:#0f1326; --primary-soft:#1f2a52;
  --live:#50e3d4; --success:#5fd49a; --success-soft:#173326; --warning:#f5b76f; --warning-soft:#3a2a17;
  --danger:#ff8a7a; --danger-soft:#3d1f1d;
  --agent-claude:#c98af0; --agent-codex:#5fd47e; --agent-herdr:#6cd0fb;
  --code-bg:#0a0d1c; --scrim:rgba(0,0,0,.6); --shadow-float:0 6px 20px rgba(0,0,0,.5);
  --chrome:#05070f;
}
:root { --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px;
  --r-sm:8px; --r-md:12px; --r-lg:18px; --r-xl:24px;
  --sans:-apple-system,"SF Pro Text","PingFang SC",system-ui,sans-serif;
  --display:-apple-system,"SF Pro Display","PingFang SC",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace; }
*,*::before,*::after { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { background:var(--chrome); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; text-align:inherit; }
input,textarea { font:inherit; color:inherit; }

/* Page layout: guide + phone */
.page { min-height:100%; display:flex; gap:40px; justify-content:center; align-items:flex-start; padding:32px 16px; }
.guide { width:300px; flex:none; color:var(--ink); position:sticky; top:32px; }
.guide h1 { font:700 22px/28px var(--display); margin:0 0 4px; }
.guide p { margin:0 0 16px; font:400 14px/20px var(--sans); color:var(--ink-muted); }
.guide h2 { font:600 12px/16px var(--sans); color:var(--ink-muted); margin:20px 0 8px; text-transform:none; }
.guide .ctl { display:flex; gap:6px; flex-wrap:wrap; }
.guide .ctl button { height:32px; padding:0 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font:500 13px/1 var(--sans); }
.guide .ctl button[aria-pressed="true"] { background:var(--primary); color:var(--on-primary); border-color:var(--primary); }
.guide ol { margin:0; padding-left:18px; font:400 13px/20px var(--sans); color:var(--ink-muted); }
.guide ol li { margin-bottom:4px; }
.guide ol button { color:var(--primary); font-weight:500; }
@media (max-width:760px) { .guide { display:none; } .page { padding:0; } .phone { border-radius:0; border:0; height:100vh; width:100vw; } }

/* Phone */
.phone { position:relative; width:390px; height:844px; flex:none; border-radius:48px; background:var(--bg); border:10px solid #0b0d18; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.25); }
.statusbar { height:50px; flex:none; display:flex; justify-content:space-between; align-items:flex-end; padding:0 30px 8px; font:600 15px/1 var(--sans); position:relative; z-index:5; }
.statusbar.inv { color:#fff; }
.island { position:absolute; top:11px; left:50%; transform:translateX(-50%); width:120px; height:34px; border-radius:20px; background:#000; z-index:6; }
.viewport { flex:1; position:relative; overflow:hidden; }
.screen { position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg); }
.screen.enter { animation:push .28s cubic-bezier(.2,.8,.2,1); }
.screen.back { animation:pop .24s cubic-bezier(.2,.8,.2,1); }
@keyframes push { from { transform:translateX(30%); opacity:.4 } to { transform:none; opacity:1 } }
@keyframes pop { from { transform:translateX(-12%); opacity:.6 } to { transform:none; opacity:1 } }
@media (prefers-reduced-motion:reduce) { .screen.enter,.screen.back,.sheet,.toast { animation:none !important; } }
.scroll { flex:1; overflow-y:auto; overflow-x:hidden; padding:0 var(--s4) var(--s6); display:flex; flex-direction:column; gap:var(--s3); scrollbar-width:none; }
.scroll::-webkit-scrollbar { display:none; }
.scroll > * { flex-shrink:0; }
.home-ind { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:var(--ink); opacity:.8; z-index:30; pointer-events:none; }

/* Icons */
.i { width:20px; height:20px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.i.sm { width:16px; height:16px; } .i.xs { width:12px; height:12px; stroke-width:2.2; } .i.lg { width:24px; height:24px; }
.i.fill { fill:currentColor; stroke:none; }

/* Nav */
.nav { height:48px; flex:none; display:grid; grid-template-columns:96px minmax(0,1fr) 96px; align-items:center; padding:0 6px; }
.nav .t { text-align:center; min-width:0; }
.nav .t b { display:block; font:600 16px/20px var(--sans); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav .t span { display:block; font:500 12px/16px var(--sans); color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.nav .l { display:flex; justify-content:flex-start; } .nav .r { display:flex; justify-content:flex-end; }
.ib { position:relative; width:44px; height:44px; display:inline-flex; align-items:center; justify-content:center; border-radius:999px; color:var(--ink); }
.ib.primary { color:var(--primary); }
.ib:active { background:var(--surface-sunken); }
.back { display:inline-flex; align-items:center; height:44px; padding:0 4px; color:var(--primary); font:400 16px/1 var(--sans); max-width:96px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.back .i { flex:none; margin-right:-2px; }
.textbtn { height:44px; padding:0 10px; color:var(--primary); font:400 16px/1 var(--sans); }
.textbtn.b { font-weight:600; } .textbtn:disabled { color:var(--ink-faint); }
.header { padding:4px var(--s4) 8px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.large { font:700 32px/38px var(--display); letter-spacing:-.4px; margin:0; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--live); flex:none; }
.dot.off { background:var(--ink-faint); }
.dot.pulse { box-shadow:0 0 0 0 var(--live); animation:pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 50%,transparent) } 100% { box-shadow:0 0 0 7px transparent } }
.devpill { display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 12px 0 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font:600 14px/1 var(--sans); max-width:230px; }
.devpill small { font:500 12px/1 var(--sans); color:var(--ink-muted); white-space:nowrap; }
.devpill .n { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* Tabbar */
.tabbar { flex:none; display:grid; grid-template-columns:repeat(3,1fr); padding:6px 8px 26px; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(16px); border-top:1px solid var(--line); }
.tab { display:flex; flex-direction:column; align-items:center; gap:3px; color:var(--ink-faint); font:500 11px/13px var(--sans); position:relative; padding-top:4px; }
.tab[aria-current="page"] { color:var(--primary); }
.tab .badge { position:absolute; top:0; left:calc(50% + 6px); }
.badge { min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--warning); color:var(--surface); font:700 11px/18px var(--sans); text-align:center; }

/* Buttons */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:var(--r-md); font:600 16px/1 var(--sans); text-align:center; }
.btn.primary { background:var(--primary); color:var(--on-primary); }
.btn.secondary { background:var(--surface-sunken); color:var(--ink); }
.btn.danger { background:var(--danger-soft); color:var(--danger); }
.btn.ghost { color:var(--primary); padding:0 8px; font-weight:500; }
.btn.block { width:100%; min-height:50px; }
.btn.pill { border-radius:999px; }
.btn.float { box-shadow:var(--shadow-float); }
.btn:disabled { opacity:.4; cursor:default; }
.btn:active:not(:disabled) { filter:brightness(.94); }
.btn.sm { min-height:34px; padding:0 12px; font-size:14px; border-radius:10px; }

/* Segmented */
.seg { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:2px; padding:3px; border-radius:var(--r-md); background:var(--surface-sunken); }
.seg button { display:flex; align-items:center; justify-content:center; gap:6px; height:36px; border-radius:9px; color:var(--ink-muted); font:500 15px/1 var(--sans); text-align:center; }
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.08); }
.seg button.off { opacity:.55; }
.seg.small button { height:30px; font-size:13px; }
.c-claude { color:var(--agent-claude); } .c-codex { color:var(--agent-codex); } .c-herdr { color:var(--agent-herdr); }

/* Chips */
.chips { display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
.chip { flex:none; height:32px; padding:0 12px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font:500 14px/1 var(--sans); color:var(--ink-muted); display:inline-flex; align-items:center; gap:6px; }
.chip[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.chip small { font:500 12px/1 var(--sans); opacity:.75; }

/* Sections, groups, rows */
.sh { display:flex; align-items:center; justify-content:space-between; margin-top:var(--s3); padding:0 4px; min-height:28px; }
.sh h3 { margin:0; font:600 13px/18px var(--sans); color:var(--ink-muted); }
.sh .acts { display:flex; gap:0; margin-right:-10px; color:var(--ink-muted); }
.sh .acts .ib { width:36px; height:36px; color:var(--ink-muted); }
.foot { font:400 13px/18px var(--sans); color:var(--ink-muted); padding:0 4px; }
.group { background:var(--surface); border-radius:var(--r-lg); overflow:hidden; }
.row { display:flex; align-items:center; gap:var(--s3); min-height:60px; padding:12px var(--s4); position:relative; width:100%; }
button.row:active, .row.tap:active { background:var(--surface-sunken); }
.row + .row::before { content:""; position:absolute; top:0; left:64px; right:0; border-top:1px solid var(--line); }
.row.plain + .row.plain::before, .row.inset0 + .row::before { left:16px; }
.tile { width:36px; height:36px; flex:none; display:grid; place-items:center; border-radius:var(--r-md); background:var(--surface-sunken); color:var(--ink-muted); }
.tile.accent { background:var(--primary-soft); color:var(--primary); }
.tile.warn { background:var(--warning-soft); color:var(--warning); }
.tile.num { font:600 15px/1 var(--sans); }
.main { flex:1; min-width:0; }
.top { display:flex; align-items:baseline; gap:8px; }
.name { flex:1; min-width:0; font:500 16px/21px var(--sans); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.time { font:500 12px/16px var(--sans); color:var(--ink-muted); flex:none; font-variant-numeric:tabular-nums; }
.sub { margin-top:2px; font:400 13px/18px var(--sans); color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sub.mono, .mono { font-family:var(--mono); }
.meta { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.chev { color:var(--ink-faint); }
.val { color:var(--ink-muted); font:400 15px/20px var(--sans); display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
.label { flex:1; font:400 16px/21px var(--sans); }
.row.danger .label { color:var(--danger); }
.row.link .label { color:var(--primary); }

/* Tags */
.tag { display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:var(--r-sm); font:500 12px/1 var(--sans); white-space:nowrap; }
.tag.running { background:var(--primary-soft); color:var(--live); }
.tag.waiting { background:var(--warning-soft); color:var(--warning); }
.tag.done { background:var(--success-soft); color:var(--success); }
.tag.failed, .tag.cancelled { background:var(--danger-soft); color:var(--danger); }
.tag.neutral { background:var(--surface-sunken); color:var(--ink-muted); }
.tag .dot { width:6px; height:6px; }

/* Cards */
.card { background:var(--surface); border-radius:var(--r-lg); padding:var(--s4); }
.attn { display:flex; align-items:center; gap:12px; background:var(--warning-soft); border-radius:var(--r-lg); padding:14px var(--s4); width:100%; }
.attn b { display:block; font:600 15px/20px var(--sans); color:var(--warning); }
.attn span { display:block; font:400 13px/18px var(--sans); color:var(--ink); }
.attn .chev { color:var(--warning); }
.offline { display:flex; align-items:center; gap:10px; background:var(--surface-sunken); border-radius:var(--r-md); padding:10px 12px; font:500 13px/18px var(--sans); color:var(--ink-muted); }
.offline .btn { margin-left:auto; }
.live-card { display:flex; flex-direction:column; gap:10px; width:100%; }
.live-line { font:400 13px/18px var(--mono); color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hero .eyebrow { font:500 12px/16px var(--sans); color:var(--ink-muted); }
.hero .title { font:600 17px/22px var(--sans); }
.hero .path { font:400 13px/18px var(--mono); color:var(--ink-muted); margin-top:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; direction:rtl; text-align:left; }
.resume { display:flex; align-items:center; gap:10px; margin-top:12px; padding:12px; border-radius:var(--r-md); background:var(--bg); width:100%; }
.resume .q { flex:1; min-width:0; font:400 15px/20px var(--sans); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.resume .go { font:600 15px/1 var(--sans); color:var(--primary); display:inline-flex; align-items:center; gap:2px; }
.search { display:flex; align-items:center; gap:8px; height:40px; padding:0 12px; border-radius:var(--r-md); background:var(--surface-sunken); color:var(--ink-muted); }
.search input { flex:1; border:0; outline:0; background:transparent; font-size:16px; color:var(--ink); min-width:0; }
.search input::placeholder { color:var(--ink-muted); }
.empty { text-align:center; padding:var(--s8) var(--s4); display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--ink-muted); }
.empty b { color:var(--ink); font:600 17px/22px var(--sans); }
.empty p { margin:0; font:400 14px/20px var(--sans); max-width:260px; }
.fab-wrap { position:absolute; left:0; right:0; bottom:16px; display:flex; justify-content:center; pointer-events:none; z-index:4; }
.fab-wrap .btn { pointer-events:auto; }

/* Chat */
.turn { display:flex; flex-direction:column; gap:6px; }
.turn.me { align-items:flex-end; }
.bubble { max-width:84%; padding:10px 14px; border-radius:var(--r-lg); border-bottom-right-radius:6px; background:var(--primary-soft); font:400 16px/23px var(--sans); white-space:pre-wrap; word-break:break-word; }
.who { display:flex; align-items:center; gap:8px; font:500 12px/16px var(--sans); color:var(--ink-muted); }
.avatar { width:22px; height:22px; display:grid; place-items:center; border-radius:7px; background:var(--surface-sunken); }
.prose { font:400 16px/24px var(--sans); }
.prose p { margin:0 0 8px; } .prose p:last-child { margin:0; }
.prose code { font:400 13.5px/1 var(--mono); background:var(--surface-sunken); padding:2px 5px; border-radius:5px; }
.caret { display:inline-block; width:7px; height:16px; background:var(--live); vertical-align:-2px; margin-left:2px; animation:blink 1s steps(2) infinite; border-radius:1px; }
@keyframes blink { 50% { opacity:0 } }
.ts { font:500 12px/16px var(--sans); color:var(--ink-muted); font-variant-numeric:tabular-nums; }
.racts { display:flex; gap:2px; margin-left:-10px; }
.racts .ib { width:36px; height:36px; color:var(--ink-muted); }
.steps { border:1px solid var(--line); background:var(--surface); border-radius:var(--r-md); overflow:hidden; }
.steps .sum { display:flex; align-items:center; gap:8px; min-height:44px; padding:0 12px; font:500 13px/18px var(--sans); color:var(--ink-muted); width:100%; }
.steps .sum span { flex:1; }
.step { display:flex; gap:10px; padding:9px 12px; border-top:1px solid var(--line); width:100%; align-items:flex-start; }
.step:active { background:var(--surface-sunken); }
.step .ic { color:var(--success); padding-top:1px; } .step.fail .ic { color:var(--danger); } .step.run .ic { color:var(--live); }
.step .st { flex:1; min-width:0; }
.step b { display:block; font:600 13px/18px var(--sans); }
.step span { display:block; font:400 12.5px/18px var(--mono); color:var(--ink-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.spin { animation:spin 1s linear infinite; } @keyframes spin { to { transform:rotate(360deg) } }
.code { border-radius:var(--r-md); background:var(--code-bg); color:var(--code-ink); overflow:hidden; }
.code .bar { display:flex; justify-content:space-between; align-items:center; height:32px; padding:0 12px; font:500 12px/1 var(--sans); color:var(--code-muted); border-bottom:1px solid rgba(255,255,255,.07); }
.code .bar button { color:var(--code-muted); font:500 12px/1 var(--sans); height:32px; }
.code pre { margin:0; padding:12px; font:400 12.5px/19px var(--mono); white-space:pre; overflow-x:auto; }
.code .cm { color:var(--code-muted); } .code .add { color:#7ee0a5; } .code .del { color:#ff9c8f; }
.approval { border-radius:var(--r-lg); background:var(--warning-soft); padding:var(--s4); display:flex; flex-direction:column; gap:10px; }
.approval .h { display:flex; align-items:center; gap:8px; font:600 15px/20px var(--sans); color:var(--warning); }
.approval .what { font:400 15px/21px var(--sans); }
.approval .cmd { font:400 12.5px/19px var(--mono); background:var(--surface); border-radius:var(--r-sm); padding:8px 10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%; text-align:left; }
.approval .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.approval .btns .secondary { background:var(--surface); }
.approval.resolved { background:var(--surface); border:1px solid var(--line); }
.approval.resolved .h { color:var(--ink-muted); }
.readonly { display:flex; gap:10px; align-items:flex-start; padding:12px; border-radius:var(--r-md); background:var(--surface-sunken); font:400 13px/18px var(--sans); color:var(--ink-muted); }
.jump { position:absolute; right:16px; bottom:12px; z-index:3; width:40px; height:40px; border-radius:999px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-float); display:grid; place-items:center; color:var(--ink); }
.dock { flex:none; padding:8px 12px 28px; background:var(--bg); position:relative; }
.banner { display:flex; align-items:center; gap:8px; padding:8px 8px 8px 12px; border-radius:var(--r-md); background:var(--danger-soft); color:var(--danger); font:500 13px/18px var(--sans); margin-bottom:8px; }
.banner .btn { margin-left:auto; background:var(--surface); color:var(--ink); }
.composer { display:flex; flex-direction:column; gap:4px; padding:10px 8px 6px 14px; border-radius:var(--r-xl); background:var(--surface); border:1px solid var(--line); }
.composer textarea { border:0; outline:0; background:transparent; resize:none; font:400 16px/23px var(--sans); min-height:23px; max-height:120px; padding:2px 0; }
.composer textarea::placeholder { color:var(--ink-muted); }
.composer .tools { display:flex; align-items:center; gap:4px; margin-left:-8px; }
.composer .tools .ib { width:36px; height:36px; color:var(--ink-muted); }
.mchip { display:inline-flex; align-items:center; gap:4px; height:28px; padding:0 10px; border-radius:999px; background:var(--surface-sunken); color:var(--ink-muted); font:500 13px/1 var(--sans); }
.send { margin-left:auto; width:36px; height:36px; border-radius:999px; display:grid; place-items:center; background:var(--primary); color:var(--on-primary); }
.send:disabled { background:var(--surface-sunken); color:var(--ink-faint); }
.thumbs { display:flex; gap:8px; padding-top:4px; }
.thumb { width:56px; height:56px; border-radius:var(--r-sm); background:linear-gradient(135deg,var(--primary-soft),var(--surface-sunken)); position:relative; display:grid; place-items:center; color:var(--ink-muted); }
.thumb .x { position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:999px; background:var(--ink); color:var(--bg); display:grid; place-items:center; }

.q { font:700 22px/28px var(--display); margin:4px 0 0; }
.lead { font:400 15px/21px var(--sans); color:var(--ink-muted); margin:0; }
.dock2 { flex:none; display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:10px 16px 30px; background:var(--bg); border-top:1px solid var(--line); }
.decided { flex:none; padding:14px 16px 32px; text-align:center; font:500 14px/20px var(--sans); color:var(--ink-muted); border-top:1px solid var(--line); }

/* Terminal */
.term { flex:1; background:var(--code-bg); color:var(--code-ink); font:400 12.5px/19px var(--mono); padding:12px 14px; overflow-y:auto; white-space:pre-wrap; }
.term .w { color:var(--warning); } .term .e { color:#ff9c8f; } .term .m { color:var(--code-muted); }

/* Pairing & scan */
.pairhero { display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding-top:28px; }
.appicon { width:88px; height:88px; border-radius:20px; background:var(--brand-navy); display:grid; place-items:center; }
.pairhero h2 { margin:8px 0 0; font:700 26px/32px var(--display); }
.pairhero p { margin:0; font:400 15px/21px var(--sans); color:var(--ink-muted); max-width:290px; }
.scan { position:absolute; inset:0; background:#0b0d18; color:#fff; display:flex; flex-direction:column; z-index:20; }
.scan .cam { flex:1; position:relative; background:radial-gradient(ellipse at 50% 45%,#2a2f45 0%,#0b0d18 70%); }
.scan .vf { position:absolute; left:50%; top:44%; width:250px; height:250px; transform:translate(-50%,-50%); border-radius:24px; box-shadow:0 0 0 2000px rgba(0,0,0,.45); }
.scan .vf::before,.scan .vf::after { content:""; position:absolute; inset:-2px; border-radius:24px; border:3px solid rgba(255,255,255,.95); clip-path:polygon(0 0,22% 0,22% 3%,3% 3%,3% 22%,0 22%,0 78%,3% 78%,3% 97%,22% 97%,22% 100%,0 100%); }
.scan .vf::after { transform:scaleX(-1); }
.scan .line { position:absolute; left:14px; right:14px; height:2px; top:16px; background:linear-gradient(90deg,transparent,var(--brand-teal),transparent); box-shadow:0 0 10px var(--brand-teal); animation:sweep 1.8s ease-in-out infinite alternate; }
@keyframes sweep { to { top:232px } }
.scan .qr { position:absolute; inset:58px; display:grid; grid-template-columns:repeat(9,1fr); gap:3px; opacity:.85; }
.scan .qr i { background:#fff; border-radius:2px; }
.scan .qr i.o { background:transparent; }
.scan .topbtns { position:absolute; top:58px; left:16px; right:16px; display:flex; justify-content:space-between; }
.scan .rb { width:40px; height:40px; border-radius:999px; background:rgba(255,255,255,.18); display:grid; place-items:center; color:#fff; }
.scan .hint { position:absolute; left:24px; right:24px; bottom:110px; text-align:center; font:500 15px/21px var(--sans); }
.scan .hint small { display:block; font:400 13px/18px var(--sans); opacity:.7; margin-top:4px; }
.scan .sim { position:absolute; left:24px; right:24px; bottom:40px; }
.progress { position:absolute; left:50%; top:44%; transform:translate(-50%,-50%); width:250px; padding:22px; border-radius:18px; background:rgba(10,12,24,.86); text-align:center; display:flex; flex-direction:column; gap:12px; align-items:center; font:500 15px/21px var(--sans); }
.ok { width:44px; height:44px; border-radius:999px; background:var(--brand-teal); color:#0b0d18; display:grid; place-items:center; }

/* Sheets */
.scrimbg { position:absolute; inset:0; background:var(--scrim); z-index:40; animation:fade .2s; }
@keyframes fade { from { opacity:0 } }
.sheet { position:absolute; left:0; right:0; bottom:0; z-index:41; background:var(--bg); border-radius:var(--r-xl) var(--r-xl) 0 0; max-height:92%; display:flex; flex-direction:column; animation:up .3s cubic-bezier(.2,.8,.2,1); }
.sheet.full { top:58px; max-height:none; }
@keyframes up { from { transform:translateY(100%) } }
.grab { width:36px; height:5px; border-radius:3px; background:var(--ink-faint); opacity:.5; margin:8px auto 0; flex:none; }
.sheet .nav { grid-template-columns:80px 1fr 80px; }
.sheet .scroll { padding-bottom:16px; }
.sheet .dockb { flex:none; padding:10px 16px 30px; border-top:1px solid var(--line); }
.opt { display:flex; align-items:center; gap:12px; padding:12px 16px; width:100%; min-height:56px; position:relative; }
.opt + .opt::before { content:""; position:absolute; top:0; left:16px; right:0; border-top:1px solid var(--line); }
.opt .check { color:var(--primary); }
.opt b { display:block; font:500 16px/21px var(--sans); }
.opt span { display:block; font:400 13px/18px var(--sans); color:var(--ink-muted); }
.field { background:var(--surface); border-radius:var(--r-lg); padding:12px 16px; }
.field textarea, .field input { width:100%; border:0; outline:0; background:transparent; font:400 16px/23px var(--sans); resize:none; }
.field textarea { min-height:110px; }
.field input::placeholder,.field textarea::placeholder { color:var(--ink-muted); }
.toggle { width:51px; height:31px; border-radius:999px; background:var(--surface-sunken); position:relative; flex:none; transition:background .2s; }
.toggle::after { content:""; position:absolute; top:2px; left:2px; width:27px; height:27px; border-radius:999px; background:#fff; box-shadow:0 2px 4px rgba(0,0,0,.2); transition:transform .2s; }
.toggle[aria-checked="true"] { background:var(--primary); }
.toggle[aria-checked="true"]::after { transform:translateX(20px); }
.alert { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:290px; z-index:42; background:var(--surface); border-radius:16px; overflow:hidden; text-align:center; animation:fade .18s; }
.alert .b { padding:20px 18px 16px; }
.alert h4 { margin:0 0 6px; font:600 17px/22px var(--sans); }
.alert p { margin:0; font:400 14px/20px var(--sans); color:var(--ink-muted); }
.alert .acts { display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--line); }
.alert .acts button { height:46px; text-align:center; font:400 17px/1 var(--sans); color:var(--primary); }
.alert .acts button + button { border-left:1px solid var(--line); }
.alert .acts .d { color:var(--danger); font-weight:600; }
.menu { position:absolute; top:96px; right:12px; z-index:42; width:230px; background:var(--surface); border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.25); overflow:hidden; animation:fade .15s; }
.menu button { display:flex; align-items:center; justify-content:space-between; width:100%; height:46px; padding:0 16px; font:400 16px/1 var(--sans); }
.menu button + button { border-top:1px solid var(--line); }
.menu .d { color:var(--danger); }
.menuscrim { position:absolute; inset:0; z-index:41; }

/* Toast */
.toast { position:absolute; left:50%; bottom:100px; transform:translateX(-50%); z-index:50; display:inline-flex; align-items:center; gap:8px; padding:10px 16px; border-radius:999px; background:var(--ink); color:var(--bg); font:500 15px/20px var(--sans); box-shadow:var(--shadow-float); white-space:nowrap; animation:toast .25s; }
@keyframes toast { from { opacity:0; transform:translate(-50%,10px) } }
</style>

}
function devPill() {
  const d = dev();
  return `<button class="devpill" data-act="sheet" data-v="devices" aria-label="切换 Mac">${d.online?'<span class="dot"></span>':'<span class="dot off"></span>'}<span class="n">${esc(d.name)}</span><small>${d.online?'在线':'离线'}</small>${I('chevD','xs')}</button>`;
}
function offlineBar() {
  if (online()) return '';
  return `<div class="offline">${I('alert','sm')}<span>${esc(dev().name)} 离线，显示的是上次同步的内容</span><button class="btn secondary sm" data-act="reconnect">重连</button></div>`;
}
function stepsBlock(sid, i, steps, streaming) {
  const key = sid+':'+i; const open = S.openSteps[key] ?? streaming;
  const fails = steps.filter(s => s.s==='fail').length; const run = steps.some(s => s.s==='run');
  const head = run ? `${I('spin','sm spin')}<span>正在执行第 ${steps.length} 步…</span>` : `${I(fails?'alert':'check','sm')}<span>执行了 ${steps.length} 个步骤${fails?` · ${fails} 个失败`:''}</span>`;
  const rows = open ? steps.map((s,j) => `<button class="step ${s.s==='fail'?'fail':s.s==='run'?'run':''}" data-act="stepDetail" data-v="${sid}:${i}:${j}"><span class="ic">${I(s.s==='fail'?'x':s.s==='run'?'spin':'check', 'sm'+(s.s==='run'?' spin':''))}</span><span class="st"><b>${s.k}</b><span>${esc(s.d)}</span></span><span class="chev">${I('chevR','sm')}</span></button>`).join('') : '';
  return `<div class="steps"><button class="sum" data-act="toggleSteps" data-v="${key}">${head}${I(open?'chevU':'chevD','sm')}</button>${rows}</div>`;
}
function approvalCard(a, inChat=true) {
  const s = sess(a.session); const p = proj(s.project);
  if (a.status !== 'pending') {
    const ok = a.status === 'approved';
    return `<div class="approval resolved"><div class="h">${I(ok?'check':'x','sm')}${ok?'你已允许':'你已拒绝'} · ${a.kind==='write'?'写入':'命令'}</div><div class="cmd mono">${a.kind==='write'?'':'$ '}${esc(a.target)}</div></div>`;
  }
  return `<div class="approval"><div class="h">${I('clock','sm')}等待你批准</div>
    <div class="what">${AG[p.agent].name} 想${a.kind==='write'?'写入一个文件':'运行一条命令'}：${esc(a.why)}</div>
    <button class="cmd mono" data-act="openApproval" data-v="${a.id}">${a.kind==='write'?'✎ ':'$ '}${esc(a.target)}</button>
    <div class="btns"><button class="btn secondary" data-act="decide" data-v="${a.id}:deny">拒绝</button><button class="btn primary" data-act="decide" data-v="${a.id}:allow">允许</button></div></div>`;
}

    return `<div class="turn"><div class="who"><span class="avatar">${agIcon(p.agent)}</span>${AG[p.agent].name} · ${m.at}</div>

// ---------- actions ----------
let toastTimer;
function toast(t) { S.toast = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; render(); }, 2000); }
function push(name, extra={}) { S.stack.push({ name, ...extra }); anim = 'enter'; S.sheet = null; S.menu = null; }
function decide(id, allow) {
  const a = appr(id); a.status = allow ? 'approved' : 'denied'; a.mins = 0;
  const s = sess(a.session);
  if (allow) {
    s.status = 'running'; s.live = a.kind==='write' ? `写入 ${a.target}` : `$ ${a.target}`;
    toast(a.kind==='write' ? '已允许写入' : '已允许，命令开始执行');
    streamReply(s.id, a.kind==='write'
      ? { steps:[{k:'写入文件', d:a.target, s:'ok', out:'+2 −1'}], text:'已写入。下载区现在有 Apple 芯片和 Intel 两个按钮，默认高亮 Apple 芯片。' }
      : { steps:[{k:'运行命令', d:a.target, s:'ok', out:'已删除 ios/work/rich-ui/Build (312 MB)'}, {k:'编辑文件', d:'HomeView.swift', s:'ok', out:'+4 −0'}], text:'缓存已清理并重新读取文件，修改已生效：返回首页时会刷新项目列表。' });
  } else {
    s.status = 'cancelled'; s.live = ''; toast('已拒绝');
    (S.messages[s.id] ||= []).push({ r:'agent', at:'现在', text:['好的，我不会执行这个操作。需要换个做法可以继续告诉我。'] });
  }
}
const timers = {};
function streamReply(sid, { steps, text }) {
  const s = sess(sid); s.status = 'running';
  const msg = { r:'agent', at:'现在', steps: steps.map(x => ({...x, s:'run'})), text:[''], streaming:true };
  (S.messages[sid] ||= []).push(msg);
  let k = 0, step = 0, tick = 0;
  clearInterval(timers[sid]);
  timers[sid] = setInterval(() => {
    tick++;
    if (step < msg.steps.length) { if (tick % 6) return; msg.steps[step].s = steps[step].s; step++; if (step < msg.steps.length) msg.steps[step].s = 'run'; }
    else if (k < text.length) { k = Math.min(text.length, k + 2); msg.text[0] = esc(text.slice(0, k)); }
    else { clearInterval(timers[sid]); msg.streaming = false; s.status = 'done'; s.live = ''; s.mins = 0; }
    render();
  }, 80);
}
function stop(sid) {
  clearInterval(timers[sid]); const s = sess(sid); s.status = 'cancelled'; s.live = '';
  (S.messages[sid]||[]).forEach(m => { if (m.streaming) { m.streaming = false; m.steps && m.steps.forEach(x => { if (x.s==='run') x.s = 'fail', x.out = '已停止'; }); } });
  toast('已停止');
}
function send(sid) {
  const t = (S.drafts[sid]||'').trim(); const imgs = S.drafts[sid+':img'] || 0;
  if (!t && !imgs) return;
  if (!online()) { S.sendError[sid] = true; return; }
  S.sendError[sid] = false;
  (S.messages[sid] ||= []).push({ r:'me', t, at:'现在', imgs });
  S.drafts[sid] = ''; S.drafts[sid+':img'] = 0;
  streamReply(sid, { steps:[{k:'读取文件', d:'ios/AgentBridge/HomeView.swift', s:'ok', out:'315 行'}], text:'收到。我看了一下，这个改动只需要调整 HomeView 的刷新时机，不影响其他页面。要我直接改吗？' });
}

const ACT = {
  pop: () => { S.stack.pop(); anim = 'back'; },
  tab: v => { S.tab = v; S.stack = []; S.sheet = null; anim = ''; },
  push: v => push(v),
  pushFromSheet: v => push(v),
  project: v => { S.sourceFilter = 'all'; push('project', { id:v }); },
  chat: v => push('chat', { id:v }),
  openApproval: v => push('approval', { id:v }),
  openTerminal: v => push('terminal', { id:v }),
  terminalFromSheet: v => push('terminal', { id:v }),
  sheet: v => { S.menu = null; if (v.startsWith('newChat')) { S.newChat = null; } S.sheet = v; },
  sheet2: v => { S.sheet = v; },
  back2: () => { S.sheet = 'newChat'; },
  close: () => { S.sheet = null; },
  menu: v => { S.menu = v; },
  closeMenu: () => { S.menu = null; },
  alert: v => { S.menu = null; S.alert = v; },
  closeAlert: () => { S.alert = null; },
  toast: v => { S.menu = null; toast(v); },
  agent: v => { S.agent = v; S.importSel = {}; },
  toggleSearch: () => { S.projSearch = !S.projSearch; if (!S.projSearch) S.projQuery = ''; },
  source: v => { S.sourceFilter = v; },
  toggleSteps: v => { const [sid] = v.split(':'); const cur = S.openSteps[v] ?? (sess(sid).status==='running'); S.openSteps[v] = !cur; },
  stepDetail: v => { S.sheet = 'stepDetail:' + v; },
  decide: v => { const [id, d] = v.split(':'); if (d === 'deny') { S.alert = 'deny:' + id; return; } decide(id, true); },
  doDeny: v => { S.alert = null; decide(v, false); },
  aTab: v => { S.approvalsTab = v; },
  send: v => send(v), resend: v => send(v),
  stop: v => { S.menu = null; stop(v); },
  retry: v => streamReply(v, { text:'换个思路：也可以在 scenePhase 变为 active 时统一刷新，这样从后台返回也能覆盖到。' , steps:[] }),
  addimg: v => { S.drafts[v+':img'] = Math.min(4, (S.drafts[v+':img']||0) + 1); },
  rmimg: v => { S.drafts[v+':img'] = Math.max(0, (S.drafts[v+':img']||0) - 1); },
  setModel: v => { const [sid, m] = v.split(/:(.*)/s); sess(sid).model = m; S.sheet = null; toast('下一条消息将使用 ' + m); },
  ncPerm: v => { S.newChat.perm = v; },
  ncProject: v => { S.newChat.project = v; S.newChat.model = '跟随 Mac 设置'; S.sheet = 'newChat'; },
  ncModel: v => { S.newChat.model = v; S.sheet = 'newChat'; },
  ncImg: v => { S.newChat.imgs = Math.max(0, Math.min(4, S.newChat.imgs + (+v))); },
  startChat: () => {
    const n = S.newChat; const id = 'n' + Date.now();
    const title = n.text.trim().slice(0, 18) || '图片对话';
    S.sessions.push({ id, project:n.project, title, status:'running', source:'cli', mins:0, perm:n.perm, model:n.model==='跟随 Mac 设置'?(proj(n.project).agent==='codex'?'gpt-5.4':'Sonnet 5.5'):n.model, live:'正在思考…' });
    S.messages[id] = [{ r:'me', t:n.text.trim(), at:'现在', imgs:n.imgs }];
    S.sheet = null; S.newChat = null; S.stack = [{ name:'project', id:sess(id).project }]; push('chat', { id });
    streamReply(id, { steps:[{k:'读取目录', d:proj(sess(id).project).path, s:'ok', out:'24 个文件'}], text:'好的，我先看一下项目结构，再给你一个改动方案。' });
  },
  device: v => { S.deviceId = v; S.menu = null; S.sheet = null; toast('已切换到 ' + dev().name); },
  setOnline: v => { dev().online = v === '1'; },
  reconnect: () => { dev().online = true; toast('已重新连接'); },
  notify: v => { S.notify[v] = !S.notify[v]; },
  perm: v => { S.perm = v; },
  theme: v => { S.themeMode = v; S.theme = v === '深色' ? 'dark' : v === '浅色' ? 'light' : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); },
  themeRaw: v => { S.theme = v; S.themeMode = v === 'dark' ? '深色' : '浅色'; },
  retention: v => { S.retention = v; S.sheet = null; },
  doClear: () => { S.alert = null; toast('已清除本机会话记录'); },
  doDelProject: v => { S.alert = null; S.projects = S.projects.filter(p => p.id !== v); S.stack.pop(); anim = 'back'; toast('已移除项目'); },
  doRmDevice: v => { S.alert = null; S.devices = S.devices.filter(d => d.id !== v); if (!S.devices.length) { S.paired = false; S.stack = []; } else if (S.deviceId === v) S.deviceId = S.devices[0].id; toast('已移除设备'); },
  importSel: v => { S.importSel = S.importSel || {}; S.importSel[v] = !S.importSel[v]; },
  importProjects: () => {
    const list = S.macProjects[S.agent] || []; const sel = S.importSel || {}; let n = 0;
    list.forEach((m, k) => { if (sel[k]) { S.projects.push({ id:'p'+Date.now()+k, agent:S.agent, name:m.name, path:m.path }); n++; } });
    S.macProjects[S.agent] = list.filter((_, k) => !sel[k]);
    if (S.manualPath) { S.projects.push({ id:'pm'+Date.now(), agent:S.agent, name:S.manualPath.split('/').pop(), path:S.manualPath }); n++; S.manualPath = ''; }
    S.importSel = {}; S.stack.pop(); anim = 'back'; toast(`已添加 ${n} 个项目`);
  },
  scan: () => { S.sheet = null; S.menu = null; S.scan = 'scanning'; },
  closeScan: () => { S.scan = null; },
  scanned: () => { S.scan = 'pairing'; setTimeout(() => { S.scan = 'done'; render(); setTimeout(() => {
      S.scan = null; if (!S.paired) { S.paired = true; S.tab = 'home'; S.stack = []; if (!S.devices.length) S.devices = seed().devices; S.deviceId = S.devices[0].id; }
      dev().online = true; toast('已连接 ' + dev().name); render(); }, 900); }, 1200); },
  // tour
  'tour:pair': () => { S = Object.assign(seed(), { theme:S.theme }); S.paired = false; },
  'tour:home': () => { reset(); },
  'tour:chat': () => { reset(); S.stack = [{ name:'project', id:'p1' }, { name:'chat', id:'s1' }]; },
  'tour:running': () => { reset(); S.stack = [{ name:'chat', id:'s2' }]; },
  'tour:write': () => { reset(); S.tab = 'approvals'; S.stack = [{ name:'approval', id:'a2' }]; },
  'tour:new': () => { reset(); S.sheet = 'newChat'; },
  'tour:project': () => { reset(); S.stack = [{ name:'project', id:'p1' }]; },
  'tour:devices': () => { reset(); S.sheet = 'devices'; },
  'tour:settings': () => { reset(); S.tab = 'settings'; },
};
function reset() { const t = S.theme, m = S.themeMode; Object.values(timers).forEach(clearInterval); S = seed(); S.theme = t; S.themeMode = m; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (!fn) return;
  fn(el.dataset.v); render();
});
document.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === 'draft') { S.drafts[e.target.dataset.v] = e.target.value; const b = document.querySelector('.send[data-act="send"]'); if (b) b.disabled = !e.target.value.trim() && !S.drafts[e.target.dataset.v+':img']; return; }
  if (k === 'ncText') { S.newChat.text = e.target.value; const b = document.querySelector('[data-act="startChat"]'); if (b) b.disabled = !(S.newChat.text.trim() || S.newChat.imgs) || !online() || S.perm !== '完全访问'; return; }
  S[k] = e.target.value; if (k === 'projQuery' || k === 'manualPath') render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && e.target.dataset && e.target.dataset.input === 'draft') { e.preventDefault(); send(e.target.dataset.v); render(); }
  if (e.key === 'Escape') { S.sheet = null; S.menu = null; S.alert = null; render(); }
});

// self-test: #selftest runs every flow through the action table and reports into <title>
function selftest() {
  const log = []; const step = (name, fn) => { try { fn(); render(); log.push('ok ' + name); } catch (e) { log.push('FAIL ' + name + ': ' + e.message); } };
  const click = (act, v) => { const fn = ACT[act]; if (!fn) throw new Error('no action ' + act); fn(v); };
  const has = (sel) => { if (!document.querySelector(sel)) throw new Error('missing ' + sel); };
  step('pair', () => { click('tour:pair'); render(); has('[data-act="scan"]'); click('scan'); render(); has('.scan'); });
  step('home', () => { click('tour:home'); render(); has('.attn'); has('.live-card'); });
  step('agent switch', () => { click('agent','codex'); render(); click('agent','herdr'); render(); has('.empty'); click('agent','claude'); });
  step('search', () => { click('toggleSearch'); S.projQuery = '官网'; render(); if (document.querySelectorAll('[data-act="project"]').length !== 1) throw new Error('search filter'); click('toggleSearch'); });
  step('project', () => { click('project','p1'); render(); click('source','desktop'); render(); if (document.querySelectorAll('[data-act="chat"]').length !== 1) throw new Error('source filter'); click('source','all'); });
  step('project menu', () => { click('menu','project:p1'); render(); has('.menu'); click('closeMenu'); });
  step('readonly chat', () => { click('chat','s4'); render(); has('.readonly'); click('pop'); });
  step('chat approve', () => { click('chat','s1'); render(); click('toggleSteps','s1:1'); render(); click('stepDetail','s1:1:2'); render(); has('.sheet'); click('close'); click('decide','a1:allow'); render(); if (sess('s1').status !== 'running') throw new Error('not running'); });
  step('chat stop', () => { click('stop','s1'); render(); if (sess('s1').status !== 'cancelled') throw new Error('not stopped'); });
  step('chat send', () => { S.drafts.s1 = '继续'; click('send','s1'); render(); if (sess('s1').status !== 'running') throw new Error('send'); click('stop','s1'); });
  step('offline send', () => { click('setOnline','0'); S.drafts.s1 = 'x'; click('send','s1'); render(); has('.banner'); click('reconnect'); click('resend','s1'); click('stop','s1'); });
  step('model sheet', () => { click('sheet','model:s1'); render(); click('setModel','s1:Opus 5.5'); if (sess('s1').model !== 'Opus 5.5') throw new Error('model'); });
  step('terminal', () => { click('menu','chat:s2'); render(); click('openTerminal','s2'); render(); has('.term'); });
  step('approvals deny', () => { click('tab','approvals'); render(); click('openApproval','a2'); render(); has('.add'); click('decide','a2:deny'); render(); has('.alert'); click('doDeny','a2'); render(); if (appr('a2').status !== 'denied') throw new Error('deny'); has('.decided'); });
  step('approvals history', () => { click('tab','approvals'); click('aTab','history'); render(); if (document.querySelectorAll('[data-act="openApproval"]').length < 3) throw new Error('history'); });
  step('new chat', () => { click('tab','home'); click('sheet','newChat'); render(); click('sheet2','pickProject'); render(); click('ncProject','p4'); render(); click('sheet2','pickModel'); render(); click('ncModel','gpt-5.4'); click('ncPerm','只读'); S.newChat.text = '加一个导出按钮'; render(); has('[data-act="startChat"]:not([disabled])'); click('startChat'); render(); has('.bubble'); });
  step('devices', () => { click('tab','home'); click('sheet','devices'); render(); click('device','studio'); render(); has('.offline'); click('device','mbp'); });
  step('device mgmt', () => { click('tab','settings'); click('push','devices'); render(); click('menu','device:studio'); render(); click('alert','rmDevice:studio'); render(); click('doRmDevice','studio'); if (S.devices.length !== 1) throw new Error('remove'); });
  step('add project', () => { click('tab','home'); click('push','addProject'); render(); click('importSel','0'); render(); click('importProjects'); if (!S.projects.some(p => p.name === 'prototypes')) throw new Error('import'); });
  step('settings', () => { click('tab','settings'); render(); click('notify','done'); click('perm','仅查看'); click('theme','深色'); render(); if (document.documentElement.dataset.theme !== 'dark') throw new Error('theme'); click('sheet','retention'); render(); click('retention','30 天'); click('alert','clear'); render(); click('doClear'); });
  step('perm blocks new chat', () => { click('tab','home'); click('sheet','newChat'); render(); S.newChat.text = 'x'; render(); has('[data-act="startChat"][disabled]'); click('close'); });
  Object.values(timers).forEach(clearInterval);
  const fails = log.filter(l => l.startsWith('FAIL'));
  document.title = (fails.length ? 'SELFTEST FAIL ' : 'SELFTEST OK ') + log.length;
  const pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = log.join('\n'); document.body.appendChild(pre);
}

// deep link for screenshots: #tour:chat, #dark
(function () {
  const h = location.hash.slice(1).split(',');
  if (h.includes('dark')) S.theme = 'dark';
  const t = h.find(x => x.startsWith('tour:')); if (t && ACT[t]) ACT[t]();
  if (h.includes('dark')) S.theme = 'dark';
  render();
  if (h.includes('selftest')) selftest();
})();
</script>
