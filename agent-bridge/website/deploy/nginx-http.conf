# Bootstrap only: serve the site and ACME challenge before a certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name arclink.classktv.com;

    root /var/www/arclink/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arclink/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* ^/downloads/.*\.dmg$ {
        types { }
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
