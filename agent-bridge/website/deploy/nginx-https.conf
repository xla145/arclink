# Final configuration: preserve webroot challenges for certificate renewal.
server {
    listen 80;
    listen [::]:80;
    server_name arclink.classktv.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/arclink/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://arclink.classktv.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name arclink.classktv.com;

    ssl_certificate /etc/letsencrypt/live/arclink.classktv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arclink.classktv.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/arclink/current;
    index index.html;

    location ~ \.html$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* ^/downloads/.*\.dmg$ {
        types { }
        default_type application/x-apple-diskimage;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
