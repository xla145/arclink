[workspace]
resolver = "2"
members = ["crates/bridge-network", "crates/abp-protocol", "crates/agent-adapters", "crates/agentd", "crates/abp-test-harness", "crates/agent-bridge-client", "desktop/src-tauri"]
default-members = ["crates/abp-protocol", "crates/agent-adapters", "crates/agentd", "crates/abp-test-harness"]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "MIT"
rust-version = "1.91"

[workspace.dependencies]
tokio = { version = "1.48", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
fs2 = "0.4"
libc = "0.2"
prost = "=0.13.5"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tempfile = "3"

[patch.crates-io]
netdev = { path = "third_party/netdev" }
netwatch = { path = "third_party/netwatch" }
