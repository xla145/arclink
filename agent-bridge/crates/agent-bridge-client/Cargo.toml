[package]
name = "agent-bridge-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "agent_bridge_client"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
abp-protocol = { path = "../abp-protocol" }
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
uniffi = { version = "0.32", features = ["tokio"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["uniffi/cli"]
